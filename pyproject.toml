# Workspace root: not published itself. The distributions live in packages/ (api -> rayohx-api,
# desktop -> rayohx-desktop). Both need the rayohx library from PyPI.
[tool.uv.workspace]
members = ["packages/api", "packages/desktop"]

[tool.uv.sources]
rayohx-api = { workspace = true }
rayohx-desktop = { workspace = true }
# Shared test plugin from the RayoHX repository; not published to PyPI.
rayohx-pytest = { git = "https://github.com/coldsofttech/RayoHX", subdirectory = "packages/pytest", tag = "pytest-v0.1.0" }

[dependency-groups]
dev = [
  "rayohx>=0.1.1",
  "rayohx-api",
  "rayohx-desktop",
  "rayohx-pytest",
  "cornea-shell[proxy]>=0.1.1",
  "httpx2>=2.16.2",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "ruff>=0.17.4",
  "schemathesis>=4.33.2",
  "types-setuptools>=84.2.0.20261122",
  "pip-licenses>=5.5.5",
]

[tool.ruff]
line-length = 100
src = [
  "packages/api/src",
  "packages/desktop/src",
  "packages/api/tests",
  "packages/desktop/tests",
]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "S", "SIM", "T20", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "S105", "S106", "S603"]  # assert, subprocess and fake passwords are fine in tests
"packages/api/scripts/**" = ["T201"]  # scripts print what they did
"scripts/**" = ["S603", "T201"]  # scripts run trusted commands and print progress

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "packages/api:packages/api/src:packages/desktop/src"
files = ["packages"]
exclude = ["/build/"]

[tool.pyright]
extraPaths = [
  "packages/api/src",
  "packages/desktop/src",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration' --strict-markers --cov=rayohx_api --cov=rayohx_desktop --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: slower end-to-end tests, run in CI but not by default or in pre-commit"]

[tool.coverage.run]
branch = true
