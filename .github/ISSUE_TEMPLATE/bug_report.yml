name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which part is affected?
      options:
        - Desktop window (rayohx-desktop)
        - API
        - Windows setup (installer, uninstaller)
        - Portable zip
        - Documentation
        - Not Sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows setup (.exe)
        - Portable zip
        - Built from source
        - Not Sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release (for example 0.1.0, shown by `rayohxd.exe --version` or in Settings > Apps) or commit you are using.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, and whether the setup was run for one user or all users. For the desktop window, also say if the Microsoft Edge WebView2 runtime is installed. If you built from source, add your Python version.
      placeholder: |
        Windows 11 23H2, installed for the current user, WebView2 installed
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or personal information first.
