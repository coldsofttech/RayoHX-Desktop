name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Which part is this for?
      options:
        - Desktop window (rayohx-desktop)
        - API
        - Windows setup (installer, uninstaller)
        - Portable zip
        - Documentation
        - Not Sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
