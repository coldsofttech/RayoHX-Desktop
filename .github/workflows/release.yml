name: Release

# Runs when a GitHub release is published with a tag v*. Builds the desktop window
# (rayohx-desktop, which carries the API routes) and the API (rayohx-api) as compiled Nuitka wheels
# for Windows, one per Python version, with no sdist and no .py sources, and attaches them to the
# release, with a portable app (rayohxd.exe and lib/, frozen with PyInstaller) as a zip, a Windows
# setup (NSIS) for it, and SHA256SUMS.txt. Nothing is published to PyPI.
#
# The job that attaches the files waits for a reviewer of the `desktop` environment
# (Settings > Environments), after everything has been built.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  UI_DIR: packages/desktop/src/rayohx_desktop/ui

jobs:
  check:
    name: check tag
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Check the tag matches the package versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          desktop="$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' packages/desktop/src/rayohx_desktop/__init__.py | head -n 1)"
          api="$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' packages/api/src/rayohx_api/__init__.py | head -n 1)"
          echo "tag $TAG, rayohx-desktop $desktop, rayohx-api $api"
          [ -n "$desktop" ] && [ "$TAG" = "v$desktop" ] || { echo "Tag $TAG does not match rayohx-desktop $desktop"; exit 1; }

  frontend:
    name: build the front end
    needs: check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Build the front end
        uses: ./.github/actions/run-ui-npm
        with:
          node-version: "26"
          command: npm run build
          upload-dist: "true"

  build:
    name: build (compiled wheels)
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Download the front end build
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ${{ env.UI_DIR }}/dist/
      - name: Build the compiled API wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: packages/api
          output-dir: dist
      - name: Build the compiled window wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          package-dir: packages/desktop
          output-dir: dist
      - name: Upload the wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error

  freeze:
    name: freeze (portable app)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: "false"
      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Install NSIS
        uses: ./.github/actions/install-nsis
      - name: Freeze the window with PyInstaller and build the setup
        run: python scripts/build.py --no-build --setup --wheels dist
      - name: Install and uninstall the setup
        uses: ./.github/actions/test-setup
      - name: Upload the portable app and the setup
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  attach:
    name: attach to the release
    needs: [build, freeze]
    runs-on: windows-latest
    timeout-minutes: 10
    environment: desktop
    permissions:
      contents: write # attach the files to the release
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Download the portable app and the setup
        uses: actions/download-artifact@v8
        with:
          name: app
          path: dist/
      - name: Write the checksums
        working-directory: dist
        run: sha256sum ./*.whl ./*.zip ./*-setup.exe > SHA256SUMS.txt
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.whl dist/*.zip dist/*-setup.exe dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
