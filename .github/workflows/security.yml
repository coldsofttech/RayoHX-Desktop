name: Security

# Static analysis (Semgrep). Findings are uploaded as SARIF, so they show up in the repository's
# Security tab (Code scanning) next to CodeQL, and the job fails when it finds a problem. These jobs
# are not part of the required `ci` check, so a new rule does not block unrelated pull requests. The
# weekly run catches vulnerabilities published after a merge. Scans the API, the window and the
# workflows.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-api:
    name: semgrep (api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Scan the API with Semgrep
        uses: ./.github/actions/semgrep
        with:
          path: packages/api
          configs: p/python p/owasp-top-ten
          category: semgrep-api

  semgrep-desktop:
    name: semgrep (desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Scan the window with Semgrep
        uses: ./.github/actions/semgrep
        with:
          path: packages/desktop
          configs: p/python p/javascript p/react p/owasp-top-ten
          category: semgrep-desktop

  semgrep-workflows:
    name: semgrep (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Scan the workflows with Semgrep
        uses: ./.github/actions/semgrep
        with:
          path: .github/workflows
          configs: p/github-actions
          category: semgrep-workflows
