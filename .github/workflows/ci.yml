name: CI

# Lint, tests, integration tests and builds for the API (packages/api) and the desktop window
# (packages/desktop), with its npm front end. Both are for Windows only, so every job runs on
# Windows. The `ci` job at the end is the single required check.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UI_DIR: packages/desktop/src/rayohx_desktop/ui

jobs:
  lint:
    name: lint
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ env.UI_DIR }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ env.UI_DIR }}/package-lock.json
      - name: Install the front end dependencies
        run: npm ci --prefix "$UI_DIR"
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Check the OpenAPI document is up to date
        run: |
          uv run python packages/api/scripts/export_openapi.py
          git diff --exit-code docs/openapi.json
      - name: Run the pre-commit hooks
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: pytest # covered by the test jobs
      - name: Check dependency licenses
        run: uv run pip-licenses --from=mixed --partial-match --fail-on="GPL" --format=plain

  lint-npm:
    name: lint-npm
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Lint and check formatting
        uses: ./.github/actions/run-ui-npm
        with:
          node-version: "26"
          command: npm run lint && npm run format:check

  test:
    name: test (${{ matrix.package }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [api, desktop]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.15"
          sync-args: --locked --package rayohx-${{ matrix.package }}
      - name: Run the unit tests
        env:
          PACKAGE: ${{ matrix.package }}
        run: uv run --no-sync pytest "packages/$PACKAGE/tests" --no-cov

  test-npm:
    name: test-npm
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Run the front end tests
        uses: ./.github/actions/run-ui-npm
        with:
          node-version: "26"
          command: npm test

  build-npm:
    name: build-npm
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Build the front end
        uses: ./.github/actions/run-ui-npm
        with:
          node-version: "26"
          command: npm run build
          upload-dist: "true"

  int-test-api:
    name: int-test (api)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.15"
          sync-args: --locked --package rayohx-api
      - name: Run the API integration tests
        run: uv run --no-sync pytest -m integration packages/api/tests --no-cov

  # The window needs the built front end.
  int-test-desktop:
    name: int-test (desktop)
    needs: [build-npm]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.15"
      - name: Download the front end build
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ${{ env.UI_DIR }}/dist/
      - name: Run the window integration tests
        run: uv run pytest -m integration packages/desktop/tests --no-cov

  build:
    name: build (compiled wheels)
    needs: [build-npm]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: ./.github/actions/setup-uv
        with:
          sync: "false"
      - name: Download the front end build
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ${{ env.UI_DIR }}/dist/
      - name: Build the compiled wheels
        env:
          PYD_BUILD: "1"
        run: |
          uv build --wheel --package rayohx-api
          uv build --wheel --package rayohx-desktop
      - name: Check the package metadata
        run: uvx twine check --strict dist/*
      - name: Check the wheels hold binaries and stubs, not sources
        run: |
          python - <<'PY'
          import glob
          import re
          import zipfile

          for package in ("rayohx_api", "rayohx_desktop"):
              (wheel,) = glob.glob(f"dist/{package}-*.whl")
              names = zipfile.ZipFile(wheel).namelist()
              assert any(re.fullmatch(rf"{package}\..*\.(so|pyd)", n) for n in names), f"{package}: no binary"
              assert f"{package}/__init__.pyi" in names, f"{package}: no stubs"
              sources = [n for n in names if n.startswith(package) and n.endswith(".py")]
              assert not sources, f"{package}: the compiled wheel must not hold .py sources: {sources}"
              if package == "rayohx_desktop":
                  assert "rayohx_desktop/assets/index.html" in names, "the window wheel has no front end"
          print("wheels ok")
          PY
      - name: Smoke test the built wheels
        run: uvx --from dist/rayohx_desktop-*.whl --with dist/rayohx_api-*.whl rayohxd --version

  # Single required status check for the branch ruleset.
  ci:
    name: ci (required check)
    if: always()
    needs: [lint, lint-npm, test, test-npm, build-npm, int-test-api, int-test-desktop, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
