name: Run a front end npm command
description: Install Node.js, run `npm ci` and one command in the front end folder. Run after checkout.

inputs:
  node-version:
    description: Node.js version.
    required: true
  command:
    description: Shell command run in the front end folder.
    required: true
  upload-dist:
    description: Upload the built front end as the ui-dist artifact ("true" or "false").
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: packages/desktop/src/rayohx_desktop/ui/package-lock.json
    - name: Install the front end dependencies
      shell: bash
      run: npm ci
      working-directory: packages/desktop/src/rayohx_desktop/ui
    - name: Run ${{ inputs.command }}
      shell: bash
      env:
        UI_COMMAND: ${{ inputs.command }}
      run: eval "$UI_COMMAND"
      working-directory: packages/desktop/src/rayohx_desktop/ui
    - name: Upload the front end build
      if: inputs.upload-dist == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ui-dist
        path: packages/desktop/src/rayohx_desktop/ui/dist/
        if-no-files-found: error
