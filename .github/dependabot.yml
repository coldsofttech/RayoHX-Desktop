version: 2
updates:
  # The workflows are in /.github/workflows; each composite action has its own folder under
  # /.github/actions.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]

  # The workspace root (uv.lock) and the `rayohx>=` requirement in each package.
  - package-ecosystem: uv
    directories:
      - /
      - /packages/api
      - /packages/desktop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/desktop/src/rayohx_desktop/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  # The NSIS version (installer/tools.toml) is not seen by Dependabot; check it by hand.
  # The pinned PyInstaller version of the portable app (installer/pyinstaller/requirements.txt).
  - package-ecosystem: pip
    directory: /installer/pyinstaller
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
